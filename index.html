<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Management System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Student register</h1>
    <p id="summary" class="summary" aria-live="polite"></p>
  </header>

  <main class="layout">
    <section class="panel" aria-labelledby="form-title">
      <h2 id="form-title">Add student</h2>
      <form id="student-form" novalidate>
        <input type="hidden" id="student-id">

        <label for="roll_no">Roll number</label>
        <input id="roll_no" name="roll_no" maxlength="20" autocomplete="off" required>
        <span class="err" data-for="roll_no"></span>

        <label for="name">Full name</label>
        <input id="name" name="name" maxlength="60" autocomplete="off" required>
        <span class="err" data-for="name"></span>

        <div class="row">
          <div>
            <label for="class">Class</label>
            <input id="class" name="class" maxlength="20" placeholder="e.g. 10-A" required>
            <span class="err" data-for="class"></span>
          </div>
          <div>
            <label for="marks">Marks (0–100)</label>
            <input id="marks" name="marks" type="number" min="0" max="100" step="0.01" required>
            <span class="err" data-for="marks"></span>
          </div>
        </div>

        <label for="contact">Contact number</label>
        <input id="contact" name="contact" inputmode="numeric" maxlength="10" placeholder="10-digit mobile" required>
        <span class="err" data-for="contact"></span>

        <label for="email">Email <small>(optional)</small></label>
        <input id="email" name="email" type="email" autocomplete="off">
        <span class="err" data-for="email"></span>

        <div class="actions">
          <button type="submit" id="save-btn" class="primary">Add student</button>
          <button type="button" id="cancel-btn" class="ghost" hidden>Cancel edit</button>
        </div>
      </form>
    </section>

    <section class="panel wide" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">Students</h2>
        <input id="search" type="search" placeholder="Search by name or roll number" aria-label="Search students">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr><th>Roll no</th><th>Name</th><th>Class</th><th class="num">Marks</th><th>Contact</th><th><span class="sr">Actions</span></th></tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <p id="empty" class="empty" hidden></p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
